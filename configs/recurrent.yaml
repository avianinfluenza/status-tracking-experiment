# R0 main condition: exact weight-tied recurrence, no loop identity/stabilizer.
architecture: recurrent
d_model: 128
n_heads: 4
d_ff: 512
train_loops: 6
recurrent_blocks: 1
loop_conditioning: none
residual_scale: 1.0
dropout: 0.0
num_locations: 8

# Ablations are CLI overrides:
# R1 loop identity: --loop-conditioning learned
# random-loop training: --random-loops
# residual damping: --residual-scale 0.5
