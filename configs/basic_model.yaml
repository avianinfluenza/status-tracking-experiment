# Basic/Direct Transformer for the five-person ball-swap task.
architecture: direct
position_encoding: sinusoidal  # ablation: rope
d_model: 128
n_heads: 4
d_ff: 512
dropout: 0.0
num_layers: 6
classifier_dim: 2

training:
  epochs: 30
  batch_size: 128
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip: 1.0
  scheduler:
    name: cosine
    warmup_epochs: 0
    min_lr: 0.0
  seeds: [0, 1, 2]

validation:
  ratio: 0.1

checkpointing:
  save_every: 5
  resume: null  # set to auto to continue checkpoints/last.pt
  overwrite: false

performance:
  amp: true
  num_workers: 2
  pin_memory: true
  persistent_workers: true

evaluation:
  batch_size: 128
  splits: [id_test, ood_x4, ood_x8]
  metrics: [slot_accuracy, exact_match, exact_match_by_swaps]
