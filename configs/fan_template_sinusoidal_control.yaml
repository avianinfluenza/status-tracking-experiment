# Diagnostic control: preserves the original Korean template and gives the
# Fan recurrence explicit absolute positions. Do not mix with Fan NoPE results.
architecture: fan-recurrent
position_encoding: sinusoidal
fan_input_format: template
fan_positional_control: true
d_model: 128
n_heads: 4
d_ff: 512
dropout: 0.0
num_layers: 1
num_loops: 10

training:
  online_training: true
  train_steps: 100000
  batch_size: 128
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip: 1.0
  swaps_per_loop: 1.0
  curriculum_min_swaps: 2
  curriculum_max_swaps: 10
  curriculum_steps_per_length: 1000

ablations:
  deep_supervision_weight: 0.0
